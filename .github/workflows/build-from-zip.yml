name: Build BootText QMOD from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/build-from-zip.yml"
      - "boottext-build-kit-readme-license.zip"
      - "boottext-quest-source/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Find and prepare BootText source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import zipfile

          repo = Path.cwd().resolve()
          destination = repo / "unzipped"
          destination.mkdir(exist_ok=True)

          def is_source_root(path: Path) -> bool:
              return (
                  (path / "src" / "main.cpp").is_file()
                  and (path / "scripts" / "prepare_ci_project.py").is_file()
                  and (path / "scripts" / "pack_qmod.py").is_file()
              )

          # First accept a project whose files were uploaded directly to GitHub.
          direct_candidates = [repo]
          for folder in repo.rglob("src"):
              if folder.is_dir() and folder.parent != destination and ".git" not in folder.parts:
                  direct_candidates.append(folder.parent)
          direct_candidates = list(dict.fromkeys(p.resolve() for p in direct_candidates))
          direct = [p for p in direct_candidates if is_source_root(p)]

          if direct:
              source_root = direct[0]
              print(f"Using source files already in repository: {source_root}")
          else:
              archives = []
              for candidate in repo.rglob("*.zip"):
                  if ".git" in candidate.parts or "unzipped" in candidate.parts:
                      continue
                  try:
                      with zipfile.ZipFile(candidate) as zf:
                          names = {name.rstrip("/") for name in zf.namelist()}
                          for name in names:
                              p = PurePosixPath(name)
                              if p.parts[-2:] != ("src", "main.cpp"):
                                  continue
                              prefix = p.parent.parent
                              needed = [
                                  (prefix / "scripts" / "prepare_ci_project.py").as_posix(),
                                  (prefix / "scripts" / "pack_qmod.py").as_posix(),
                              ]
                              if all(item in names for item in needed):
                                  archives.append((candidate, prefix))
                                  break
                  except (OSError, zipfile.BadZipFile):
                      continue

              if not archives:
                  raise SystemExit(
                      "Could not find BootText source. Upload the BootText ZIP anywhere in the repository, "
                      "or upload the extracted project files. The ZIP must contain src/main.cpp and "
                      "scripts/prepare_ci_project.py."
                  )

              # Prefer the originally supplied archive name; otherwise require one unambiguous archive.
              preferred = [item for item in archives if item[0].name.lower() == "boottext-build-kit-readme-license.zip"]
              if preferred:
                  archive, prefix = preferred[0]
              elif len(archives) == 1:
                  archive, prefix = archives[0]
              else:
                  found = ", ".join(str(item[0].relative_to(repo)) for item in archives)
                  raise SystemExit(f"Found multiple possible BootText ZIPs: {found}. Keep one ZIP in the repo and retry.")

              print(f"Using archive: {archive.relative_to(repo)}")
              extract_dir = destination / archive.stem
              extract_dir.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise SystemExit(f"ZIP integrity error in {bad}")
                  for member in zf.infolist():
                      item = PurePosixPath(member.filename)
                      if item.is_absolute() or ".." in item.parts:
                          raise SystemExit(f"Unsafe ZIP path: {member.filename}")
                  zf.extractall(extract_dir)

              source_root = (extract_dir / Path(prefix.as_posix())).resolve()
              if not is_source_root(source_root):
                  raise SystemExit(f"Extracted ZIP, but the BootText source layout was not found at {source_root}")
              print(f"Extracted BootText source: {source_root}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"BOOTTEXT_SOURCE={source_root}\n")
          PY

      - name: Check out the Quest mod template
        uses: actions/checkout@v4
        with:
          repository: Lauriethefish/quest-mod-template
          ref: main
          path: _quest-mod-template

      # QPM.CLI v1.5.11 uses the unstable `try_find` feature.
      # Build it with nightly Rust, not stable, or cargo install fails with E0554.
      - name: Set up Rust nightly for QPM CLI
        uses: dtolnay/rust-toolchain@nightly

      - name: Install QPM CLI
        run: cargo install --git https://github.com/QuestPackageManager/QPM.CLI --tag v1.5.11 --locked --bin qpm qpm_cli

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Prepare the BootText template project
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BOOTTEXT_SOURCE/scripts/prepare_ci_project.py" \
            --template-dir _quest-mod-template/template \
            --output-dir _build \
            --ndk-path "$ANDROID_NDK_HOME"

      - name: Align Quest dependencies with current BSML and Scotland2 headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          qpm_path = Path("_build/qpm.json")
          data = json.loads(qpm_path.read_text(encoding="utf-8"))
          deps = data.get("dependencies", [])
          hook = next((d for d in deps if d.get("id") == "beatsaber-hook"), None)
          bsml = next((d for d in deps if d.get("id") == "bsml"), None)
          if hook is None or bsml is None:
              raise SystemExit("Required beatsaber-hook or bsml dependency is missing from qpm.json")

          old_hook = hook.get("versionRange")
          hook["versionRange"] = "^6.4.1"

          # Legacy paper 3 headers conflict with the paper2_scotland2 headers
          # already used by the current Quest/Scotland2 dependency set.
          deps = [d for d in deps if d.get("id") != "paper"]
          paper2 = next((d for d in deps if d.get("id") == "paper2_scotland2"), None)
          if paper2 is None:
              paper2 = {"id": "paper2_scotland2", "versionRange": "^4.6.4", "additionalData": {}}
              deps.append(paper2)
          else:
              paper2["versionRange"] = "^4.6.4"
          data["dependencies"] = deps
          qpm_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          header_path = Path("_build/include/main.hpp")
          header = header_path.read_text(encoding="utf-8")
          legacy_include = '#include "paper/shared/logger.hpp"'
          modern_include = '#include "beatsaber-hook/shared/utils/logging.hpp"'
          if legacy_include in header:
              header = header.replace(legacy_include, modern_include)
          elif modern_include not in header:
              raise SystemExit("Could not locate the expected logger include in include/main.hpp")

          # The source archive's main.hpp replaces the template header, so restore
          # its config include. The template defines MOD_EXTERN_FUNC in _config.hpp.
          modloader_include = '#include "scotland2/shared/modloader.h"'
          config_include = '#include "_config.hpp"'
          if config_include not in header:
              if modloader_include not in header:
                  raise SystemExit("Could not locate the Scotland2 include in include/main.hpp")
              header = header.replace(modloader_include, modloader_include + "\\n" + config_include)
          header_path.write_text(header, encoding="utf-8")

          source_path = Path("_build/src/main.cpp")
          source = source_path.read_text(encoding="utf-8")
          old_string_helper = "il2cpp_utils::createcsstr"
          if old_string_helper in source:
              source = source.replace(old_string_helper, "il2cpp_utils::newcsstr")
              source_path.write_text(source, encoding="utf-8")
              print("Updated obsolete il2cpp_utils::createcsstr calls to newcsstr.")
          elif "il2cpp_utils::newcsstr" not in source:
              raise SystemExit("Could not find a supported IL2CPP string helper in src/main.cpp")

          print("Using the template config header for MOD_EXTERN_FUNC and the current logging include.")
          print(f"Updated beatsaber-hook {old_hook} -> {hook['versionRange']}; BSML is {bsml.get('versionRange')}.")
          print("Replaced legacy paper dependency with paper2_scotland2 ^4.6.4 to avoid duplicate logger definitions.")
          PY

      - name: Restore dependencies and compile Quest ARM64 library
        shell: bash
        run: |
          set -euo pipefail
          cd _build
          qpm restore
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -B build
          cmake --build build --parallel 2
          test -f build/libboottext.so

      - name: Package and validate the QMOD
        run: python3 _build/scripts/pack_qmod.py _build/build/libboottext.so --output BootText.qmod

      - name: Upload QMOD artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootText-QMOD-Beat-Saber-1.40.8
          path: BootText.qmod
          if-no-files-found: error
